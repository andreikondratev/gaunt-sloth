name: AI PR Review

# The pull_request_target is an important feature. It is running on files from `main`.
# This is important to avoid changes which would execute code from the PR.
# See postmortem here https://github.com/pukeko-robotics/gaunt-sloth/discussions/304
#
# Flow:
#   concierge       - classifies the PR author (internal vs external).
#   internal-review - runs automatically for OWNER/MEMBER/COLLABORATOR,
#                     and re-checks the association internally (defense in depth).
#   review          - runs for external contributors under the `review` environment,
#                     which has Required reviewers configured, so a maintainer must
#                     approve the deployment before the review executes.
# The two review paths share the same code via _review-shared.yml.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - 'main'

# Least-privilege default: jobs get no GITHUB_TOKEN permissions unless they
# opt in explicitly below. The concierge job needs none (it only writes to
# $GITHUB_OUTPUT); the review jobs declare exactly what they require.
permissions: {}

jobs:
  concierge:
    runs-on: ubuntu-latest
    # Dependabot pull requests are reviewed too, and on the external path: a bot has
    # no meaningful author association, so it falls through the case below to
    # internal=false. That is deliberate — the conservative branch is the right one
    # for a machine-authored change. It matters most for actions: everything under
    # .github/workflows is pinned by moving major tag, so the only update Dependabot
    # can raise for one is a major bump, which is precisely the class of change CI
    # itself depends on. There is therefore no head-ref exemption on this job. When a
    # run raised by Dependabot cannot read the review's provider key, _review-shared.yml
    # skips the review with a message rather than failing it; for every other author a
    # missing key still fails the run. See OPS-134.
    outputs:
      internal: ${{ steps.classify.outputs.internal }}
    steps:
      - name: Classify author association
        id: classify
        env:
          ASSOC: ${{ github.event.pull_request.author_association }}
        run: |
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR) echo "internal=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "internal=false" >> "$GITHUB_OUTPUT" ;;
          esac

  internal-review:
    needs: concierge
    if: ${{ needs.concierge.outputs.internal == 'true' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/_review-shared.yml
    with:
      environment: review-internal
      enforce_internal: true
    secrets: inherit

  review:
    needs: concierge
    if: ${{ needs.concierge.outputs.internal == 'false' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/_review-shared.yml
    with:
      environment: review
    secrets: inherit
