# Reusable review workflow shared by the internal-review and external review paths.
#
# It is called from review.yml after the concierge job has classified the PR author.
# The `environment` input selects which GitHub environment (and therefore which
# protection rules, e.g. required reviewers) gate this run.
#
# The pull_request_target context runs files from `main`, not from the PR.
# This is important to avoid executing code from the PR.
# See postmortem here https://github.com/pukeko-robotics/gaunt-sloth/discussions/304
name: AI PR Review (shared)

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment to run under (selects protection rules).'
        type: string
        required: true
      enforce_internal:
        description: 'Hard-fail when the PR author is not OWNER/MEMBER/COLLABORATOR.'
        type: boolean
        default: false

jobs:
  ai-code-review:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Enforce internal author association
        if: |
          inputs.enforce_internal &&
          github.event.pull_request.author_association != 'COLLABORATOR' &&
          github.event.pull_request.author_association != 'MEMBER' &&
          github.event.pull_request.author_association != 'OWNER'
        run: |
          echo "Unauthorized external contributor reached the internal review path."
          exit 1

      # OPS-134 — what a run with no readable provider key does, decided in one place.
      # The `review` identity profile this workflow selects is google-genai, so
      # GOOGLE_API_KEY is the key the review itself needs.
      #
      # Raised by Dependabot, the key can be unreadable for a structural reason —
      # GitHub scopes Dependabot's secrets separately from the Actions ones — and
      # nobody can act on that from the pull request. There the review skips with a
      # message naming the remedy, because an unreviewed dependency pull request is a
      # hole worth closing and a red one no author can fix is worse than either.
      #
      # For anyone else an absent key means the key is missing or revoked, which is
      # exactly what a loud red is for: the review runs, fails, and "Check review step
      # result" fails the run as it does today. The warning on that branch only makes
      # the red legible, so it does not arrive as an opaque provider error.
      #
      # The author, not the branch name, is what separates the two: a branch prefix is
      # something anyone can type.
      - name: Decide whether the review can run
        id: review_gate
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -n "$GOOGLE_API_KEY" ]; then
            echo "run_review=true" >> "$GITHUB_OUTPUT"
          elif [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "run_review=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=AI review skipped::GOOGLE_API_KEY was not readable in this run, so the AI review was skipped rather than failed (OPS-134). This is a Dependabot pull request: add GOOGLE_API_KEY to the repository's Dependabot secrets scope (Settings, Secrets and variables, Dependabot); a secret held only in the Actions scope is not readable from a Dependabot-triggered run."
          else
            echo "run_review=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=AI review has no provider key::GOOGLE_API_KEY is not readable in this run, so the review below will fail and this run will be red (OPS-134). The key is missing or revoked in the repository's Actions secrets; this warning is here so that failure is legible rather than arriving as a provider error."
          fi

      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      # Install the PUBLISHED review CLI globally. Keep this on npm, not pnpm:
      # `pnpm add -g` drops bins in pnpm's global bin dir, which is not on PATH
      # without `pnpm setup` (not run on CI runners) — so `gaunt-sloth-review`
      # was not found post-OPS-6. npm's global bin is on PATH by default. There
      # is no repo/workspace install here (published package only), so corepack
      # and the pnpm cache are unnecessary.
      - name: Install gaunt-sloth-review
        run: npm i -g @gaunt-sloth/review@2.0.0-beta.16 @langchain/google@0.2.7 && gaunt-sloth-review --version

      - name: Extract issue number from PR title
        id: extract_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_TITLE=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json title --jq '.title')
          ISSUE_NUMBER=$(echo "$PR_TITLE" | grep -oE '^[0-9]{2,5} ' | tr -d ' ' || true)
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

      - name: Perform code review
        id: review
        # Runs unless the gate above stood it down, which happens only for a Dependabot
        # run with no readable key (OPS-134). A skipped step leaves no review.md, so the
        # comment step below skips on its own guard, and its outcome is 'skipped' rather
        # than 'failure', so "Check review step result" does not fail the run. A review
        # that RAN and failed still does, including on a keyless human pull request.
        if: steps.review_gate.outputs.run_review == 'true'
        continue-on-error: true
        run: |
          if [ -z "${{ steps.extract_issue.outputs.issue_number }}" ]; then
            gaunt-sloth-review ${{ github.event.pull_request.number }}
            # Prepend tip about linking issues when no issue number was found
            { echo 'ℹ️ **Tip:** To link this PR to an issue, start your PR title with the issue number followed by a space (e.g., "123 Fix authentication bug")'
              echo ""
              cat review.md
            } > review.tmp && mv review.tmp review.md
          else
            gaunt-sloth-review ${{ github.event.pull_request.number }} ${{ steps.extract_issue.outputs.issue_number }}
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GSLOTH_IDENTITY_PROFILE: review
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      # REL-20 — only post when there is something to post. The product writes the report even when
      # a run fails before inference, so the usual failure now arrives here as a file explaining
      # itself; this guard covers what is left, where no file was produced at all. Without it the
      # step dies inside github-script on `ENOENT ... 'review.md'`, which reports a missing file
      # several steps away from the reason there is one. The run still fails either way — "Check
      # review step result" below fails it on the review step's own outcome, which is the result
      # worth reading.
      - name: Hide older AI review comments and post new one
        if: hashFiles('review.md') != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.md', 'utf8');

            // Define a unique identifier for AI review comments
            const AI_REVIEW_IDENTIFIER = '<!-- AI-PR-REVIEW-BOT -->';
            const PREVIOUS_AI_REVIEW_SUMMARY = '<summary>🤖 Previous AI Review (Click to expand)</summary>';

            // Get all comments on this PR
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            // Find and hide older AI review comments
            const aiComments = comments.data.filter(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes(AI_REVIEW_IDENTIFIER) &&
              !comment.body.includes(PREVIOUS_AI_REVIEW_SUMMARY)
            );

            // Hide older comments by wrapping them in a collapsible section
            for (const comment of aiComments) {
              const hiddenBody = `<details>
            ${PREVIOUS_AI_REVIEW_SUMMARY}

            ${comment.body}
            </details>`;

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
                body: hiddenBody
              });
            }

            // Create new comment with the identifier
            const newCommentBody = `${AI_REVIEW_IDENTIFIER}

            ${review}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: newCommentBody
            });

      - name: Check review step result
        if: steps.review.outcome == 'failure'
        run: |
          echo "Code review step failed with exit code 1"
          exit 1
